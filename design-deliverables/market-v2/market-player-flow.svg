<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1760" viewBox="0 0 1900 1760" role="img" aria-labelledby="title desc">
  <title id="title">Droply immersive player states and product flow</title>
  <desc id="desc">Editable player UI states for playing, buffering, locked controls, playback error, landscape, plus the market-first end-to-end user flow.</desc>
  <defs>
    <style><![CDATA[
      text{font-family:"Roboto Flex",Roboto,Arial,sans-serif}.k{font-size:12px;font-weight:800;letter-spacing:1.6px;fill:#6E7180}.bt{font-size:40px;font-weight:850;letter-spacing:-1.4px}.bs{font-size:15px;font-weight:500;fill:#6E7180}.h1{font-size:29px;font-weight:850;letter-spacing:-.8px}.h2{font-size:20px;font-weight:800}.h3{font-size:16px;font-weight:800}.body{font-size:14px;font-weight:550}.small{font-size:12px;font-weight:550;fill:#9EA0AC}.tiny{font-size:10px;font-weight:750}.btn{font-size:14px;font-weight:800}.center{text-anchor:middle}.end{text-anchor:end}.white{fill:#FFFFFF}.lineW{fill:none;stroke:#FFFFFF;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.line{fill:none;stroke:#171821;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    ]]></style>
    <filter id="ps" x="-20%" y="-10%" width="140%" height="135%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#252632" flood-opacity=".14"/></filter>
    <filter id="cs" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#050508" flood-opacity=".28"/></filter>
    <clipPath id="pclip"><rect width="393" height="873" rx="38"/></clipPath><clipPath id="lclip"><rect width="873" height="393" rx="38"/></clipPath>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A9D7F4"/><stop offset=".55" stop-color="#4B72A4"/><stop offset="1" stop-color="#1B2638"/></linearGradient>
    <g id="phone"><rect width="393" height="873" rx="38" fill="#090A0F" stroke="#343541" filter="url(#ps)"/></g>
    <g id="statusW"><text x="24" y="24" class="small white">9:41</text><path d="M325 19c4-5 11-5 15 0m-10 3c2-2 4-2 5 0" class="lineW" stroke-width="1.4"/><rect x="349" y="14" width="18" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><rect x="368" y="17" width="2" height="4" rx="1" fill="#FFFFFF"/><rect x="352" y="17" width="11" height="4" rx="1" fill="#FFFFFF"/></g>
    <g id="play"><circle cx="32" cy="32" r="32" fill="#FFFFFF"/><path d="m27 21 17 11-17 11z" fill="#171821"/></g><g id="pause"><circle cx="32" cy="32" r="32" fill="#FFFFFF"/><rect x="24" y="21" width="6" height="22" rx="3" fill="#171821"/><rect x="35" y="21" width="6" height="22" rx="3" fill="#171821"/></g>
    <g id="back10"><path d="M18 9A12 12 0 1 0 24 12" class="lineW"/><path d="m18 3-1 7-7-1" class="lineW"/><text x="15" y="19" class="tiny center white">10</text></g><g id="fwd10"><path d="M6 9a12 12 0 1 1-6 3" class="lineW"/><path d="m6 3 1 7 7-1" class="lineW"/><text x="9" y="19" class="tiny center white">10</text></g>
    <g id="topPlayer"><path d="m28 63 9-9m-9 9 9 9" class="lineW"/><text x="55" y="68" class="h3 white">Now playing</text><circle cx="355" cy="63" r="20" fill="#FFFFFF" fill-opacity=".12"/><circle cx="347" cy="63" r="1.8" fill="#FFFFFF"/><circle cx="355" cy="63" r="1.8" fill="#FFFFFF"/><circle cx="363" cy="63" r="1.8" fill="#FFFFFF"/></g>
    <g id="artPortrait"><rect x="16" y="100" width="361" height="532" rx="28" fill="url(#art)"/><circle cx="296" cy="190" r="74" fill="#39D9B4" fill-opacity=".75"/><path d="M16 513c64-122 118-64 183-133 65-69 110-76 178-12v264H16z" fill="#101622" fill-opacity=".56"/><path d="M16 466c58-62 106-30 151-72 53-50 119-44 210 9v229H16z" fill="#6558F5" fill-opacity=".25"/><circle cx="85" cy="220" r="34" fill="#E9E5FF" fill-opacity=".7"/></g>
    <g id="controls">
      <text x="20" y="682" class="h2 white">A minute by the sea</text><text x="20" y="708" class="small">Downloaded • 1080p • offline</text>
      <rect x="20" y="734" width="353" height="5" rx="3" fill="#444550"/><rect x="20" y="734" width="132" height="5" rx="3" fill="#C7F464"/><circle cx="152" cy="736.5" r="7" fill="#C7F464"/>
      <text x="20" y="761" class="tiny white">01:41</text><text x="373" y="761" class="tiny end" fill="#9EA0AC">04:28</text>
      <g transform="translate(86 789)"><use href="#back10"/></g><g transform="translate(165 775)"><use href="#pause"/></g><g transform="translate(277 789)"><use href="#fwd10"/></g>
      <rect x="20" y="820" width="73" height="35" rx="16" fill="#FFFFFF" fill-opacity=".12"/><text x="56" y="843" class="tiny center white">1.0×</text><rect x="300" y="820" width="73" height="35" rx="16" fill="#FFFFFF" fill-opacity=".12"/><path d="M323 832h17v13h-17zM320 829l6 6m17-6-6 6m-11 13-6-6m23 6-6-6" class="lineW" stroke-width="1.4"/>
    </g>
  </defs>
  <rect width="1900" height="1760" fill="#EFF0F7"/><circle cx="1770" cy="20" r="230" fill="#E9E5FF"/><circle cx="100" cy="1700" r="210" fill="#C6F6EE" fill-opacity=".72"/>
  <text x="46" y="52" class="k">DROPly UI • IMMERSIVE PLAYER</text><text x="46" y="99" class="bt">The content takes the stage.</text><text x="46" y="129" class="bs">Controls arrive when needed, disappear when not, and always explain what happened.</text>
  <g transform="translate(46 164)"><text class="k">01 / PLAYING</text><text y="24" class="h3">Focused controls</text></g><g transform="translate(485 164)"><text class="k">02 / BUFFERING</text><text y="24" class="h3">Calm feedback</text></g><g transform="translate(924 164)"><text class="k">03 / LOCKED</text><text y="24" class="h3">Accidental-touch guard</text></g><g transform="translate(1363 164)"><text class="k">04 / ERROR</text><text y="24" class="h3">Actionable recovery</text></g>

  <!-- Playing -->
  <g id="player-playing" transform="translate(46 204)"><use href="#phone"/><g clip-path="url(#pclip)"><rect width="393" height="873" fill="#090A0F"/><use href="#statusW"/><use href="#topPlayer"/><use href="#artPortrait"/><rect x="16" y="100" width="361" height="532" rx="28" fill="#000000" fill-opacity=".12"/><g transform="translate(165 330)"><use href="#pause"/></g><use href="#controls"/></g></g>

  <!-- Buffering -->
  <g id="player-buffering" transform="translate(485 204)"><use href="#phone"/><g clip-path="url(#pclip)"><rect width="393" height="873" fill="#090A0F"/><use href="#statusW"/><use href="#topPlayer"/><use href="#artPortrait"/><rect x="16" y="100" width="361" height="532" rx="28" fill="#090A0F" fill-opacity=".58"/><circle cx="196" cy="352" r="36" fill="#171821" fill-opacity=".8"/><path d="M196 326a26 26 0 1 1-22 12" fill="none" stroke="#6558F5" stroke-width="5" stroke-linecap="round"/><text x="196" y="414" class="h3 center white">Loading video…</text><text x="196" y="438" class="small center">Playing from offline storage</text><use href="#controls"/><rect x="20" y="734" width="132" height="5" rx="3" fill="#C7F464"/></g></g>

  <!-- Locked -->
  <g id="player-locked" transform="translate(924 204)"><use href="#phone"/><g clip-path="url(#pclip)"><rect width="393" height="873" fill="#090A0F"/><use href="#statusW"/><use href="#artPortrait"/><rect x="16" y="100" width="361" height="532" rx="28" fill="#000000" fill-opacity=".18"/><rect x="142" y="340" width="109" height="109" rx="34" fill="#171821" fill-opacity=".86" filter="url(#cs)"/><rect x="176" y="377" width="41" height="32" rx="9" fill="none" stroke="#FFFFFF" stroke-width="3"/><path d="M184 377v-10a13 13 0 0 1 26 0v10" class="lineW" stroke-width="3"/><text x="196" y="471" class="small center white">Controls locked</text><rect x="96" y="750" width="201" height="49" rx="24" fill="#FFFFFF" fill-opacity=".14"/><path d="M123 768v13h13v-13m-10 0v-6a4 4 0 0 1 8 0v6" class="lineW" stroke-width="1.5"/><text x="206" y="780" class="btn center white">Hold to unlock</text></g></g>

  <!-- Error -->
  <g id="player-error" transform="translate(1363 204)"><use href="#phone"/><g clip-path="url(#pclip)"><rect width="393" height="873" fill="#090A0F"/><use href="#statusW"/><use href="#topPlayer"/><use href="#artPortrait"/><rect x="16" y="100" width="361" height="532" rx="28" fill="#090A0F" fill-opacity=".83"/><circle cx="196" cy="293" r="45" fill="#DC3F56"/><path d="M196 270v30m0 13v.1" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><text x="196" y="375" class="h2 center white">This video can’t play.</text><text x="196" y="404" class="small center">The file may be incomplete or unsupported.</text><rect x="74" y="438" width="245" height="54" rx="20" fill="#6558F5"/><text x="196" y="471" class="btn center white">Try again</text><rect x="74" y="504" width="245" height="54" rx="20" fill="#FFFFFF" fill-opacity=".12"/><text x="196" y="537" class="btn center white">Open file details</text><rect x="20" y="673" width="353" height="105" rx="24" fill="#191A22"/><text x="40" y="708" class="h3 white">Your file is still safe.</text><text x="40" y="733" class="small">Retry playback or remove it from Library.</text><text x="40" y="755" class="small">Error code: local_decode_04</text></g></g>

  <!-- Landscape state -->
  <g transform="translate(46 1136)"><text class="k">05 / LANDSCAPE</text><text y="24" class="h3">Immersive with reachable controls</text></g>
  <g id="player-landscape" transform="translate(46 1180)"><rect width="873" height="393" rx="38" fill="#090A0F" stroke="#343541" filter="url(#ps)"/><g clip-path="url(#lclip)"><rect width="873" height="393" fill="url(#art)"/><circle cx="677" cy="86" r="87" fill="#39D9B4" fill-opacity=".72"/><path d="M0 338c158-172 271-63 414-177 149-119 274-88 459 36v196H0z" fill="#111827" fill-opacity=".58"/><path d="M0 299c139-104 248-58 354-128 124-81 297-66 519 65v157H0z" fill="#6558F5" fill-opacity=".21"/><rect width="873" height="393" fill="#000000" fill-opacity=".15"/><path d="m34 42 9-9m-9 9 9 9" class="lineW"/><text x="62" y="47" class="h3 white">A minute by the sea</text><rect x="786" y="24" width="61" height="36" rx="18" fill="#000000" fill-opacity=".35"/><text x="816" y="47" class="tiny center white">1080P</text><g transform="translate(404 151)"><use href="#pause"/></g><g transform="translate(313 171)"><use href="#back10"/></g><g transform="translate(548 171)"><use href="#fwd10"/></g><rect x="30" y="333" width="813" height="5" rx="3" fill="#FFFFFF" fill-opacity=".3"/><rect x="30" y="333" width="305" height="5" rx="3" fill="#C7F464"/><circle cx="335" cy="335.5" r="7" fill="#C7F464"/><text x="30" y="362" class="tiny white">01:41</text><text x="843" y="362" class="tiny end white">04:28</text><rect x="738" y="345" width="48" height="31" rx="15" fill="#000000" fill-opacity=".35"/><text x="762" y="365" class="tiny center white">1.0×</text><rect x="795" y="345" width="48" height="31" rx="15" fill="#000000" fill-opacity=".35"/><path d="M810 354h17v13h-17z" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g></g>

  <!-- End-to-end flow -->
  <g id="product-flow" transform="translate(974 1136)">
    <rect width="880" height="490" rx="34" fill="#171821"/>
    <text x="28" y="42" class="k" style="fill:#39D9B4">END-TO-END / MARKET-FIRST</text><text x="28" y="80" class="h1 white">One clear path to offline.</text><text x="28" y="106" class="small" style="fill:#C9CBD6">The browser is a child flow; Home remains the product anchor.</text>
    <g transform="translate(28 145)">
      <g><rect width="180" height="78" rx="22" fill="#6558F5"/><text x="20" y="30" class="tiny white">01 • HOME</text><text x="20" y="55" class="h3 white">Paste / Share / Browse</text></g><path d="M190 39h39m-9-8 9 8-9 8" fill="none" stroke="#C9CBD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(240)"><rect width="180" height="78" rx="22" fill="#2A2B35"/><text x="20" y="30" class="tiny" fill="#39D9B4">02 • DISCOVER</text><text x="20" y="55" class="h3 white">Focused browser</text></g><path d="M430 39h39m-9-8 9 8-9 8" fill="none" stroke="#C9CBD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(480)"><rect width="180" height="78" rx="22" fill="#2A2B35"/><text x="20" y="30" class="tiny" fill="#39D9B4">03 • DETECT</text><text x="20" y="55" class="h3 white">Media dock</text></g><path d="M670 39h39m-9-8 9 8-9 8" fill="none" stroke="#C9CBD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(720)"><rect width="104" height="78" rx="22" fill="#E9E5FF"/><text x="14" y="30" class="tiny">04 • PICK</text><text x="14" y="55" class="h3">Quality</text></g>
      <path d="M772 88v36m8-9-8 9-8-9" fill="none" stroke="#C9CBD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(644 135)"><rect width="180" height="78" rx="22" fill="#C7F464"/><text x="20" y="30" class="tiny">05 • QUEUE</text><text x="20" y="55" class="h3">Speed + ETA</text></g><path d="M634 174h-39m9-8-9 8 9 8" fill="none" stroke="#C9CBD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(404 135)"><rect width="180" height="78" rx="22" fill="#2A2B35"/><text x="20" y="30" class="tiny" fill="#39D9B4">06 • LIBRARY</text><text x="20" y="55" class="h3 white">Offline inbox</text></g><path d="M394 174h-39m9-8-9 8 9 8" fill="none" stroke="#C9CBD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(164 135)"><rect width="180" height="78" rx="22" fill="#2A2B35"/><text x="20" y="30" class="tiny" fill="#39D9B4">07 • PLAYER</text><text x="20" y="55" class="h3 white">Watch offline</text></g>
    </g>
    <rect x="28" y="398" width="824" height="64" rx="22" fill="#24252F"/><circle cx="58" cy="430" r="13" fill="#39D9B4"/><path d="m52 430 4 4 8-9" fill="none" stroke="#171821" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="423" class="h3 white">Trust rule</text><text x="82" y="446" class="small" style="fill:#C9CBD6">No clipboard surveillance, no “any site” claim, no hidden download action.</text>
  </g>
</svg>
